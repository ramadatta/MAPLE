name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install MAPLES with test extras
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run the test suite (offline)
        # Every test is network-free: PubMed, Europe PMC, OpenAlex and the AI
        # service are mocked or switched off in tests/conftest.py.
        run: pytest -q
